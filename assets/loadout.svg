<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Stack: Python, C++, TypeScript, Dart / Flutter, FastAPI, PostgreSQL, Redis, Docker, OpenCore / ACPI, macOS kexts, LLM agents + RAG, x86 assembly">
<style>
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, SFMono-Regular, Consolas, monospace; }
  .sans { font-family: 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; }
  .drift { animation: drift 6s linear infinite; }
  .scan { animation: scan 7s linear infinite; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes drift { to { transform: translate(-32px, -32px); } }
  @keyframes scan { from { transform: translateY(-120px); } to { transform: translateY(250px); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  
  .led { animation: pulse 2.4s ease-in-out infinite; }
  .tile { animation: tile 4.8s ease-in-out infinite; }
  @keyframes tile { 0%, 100% { stroke-opacity: .25; } 50% { stroke-opacity: .9; } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0a1222"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#16243d" stroke-width="1"/></pattern>
  <linearGradient id="scanline" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".85" stop-color="#22d3ee" stop-opacity=".07"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity=".25"/></linearGradient>
  <radialGradient id="vignette" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#05070d" stop-opacity="0"/><stop offset="1" stop-color="#05070d" stop-opacity=".85"/></radialGradient>
  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect width="1200" height="210" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="210" fill="url(#bg)"/>
  <g class="drift"><rect width="1264" height="274" fill="url(#grid)"/></g>
  <rect width="1200" height="210" fill="url(#vignette)"/>
