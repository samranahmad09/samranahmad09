 cy="97" r="4" fill="#f472b6" filter="url(#softglow)"/><text x="1012" y="102" class="mono" font-size="13.5" fill="#e6f1ff">PostgreSQL</text><rect class="tile" style="animation-delay:2.4s" x="50" y="134" width="172" height="42" rx="6" fill="#08101e" fill-opacity=".85" stroke="#22d3ee"/><circle class="led" style="animation-delay:1.2s" cx="68" cy="155" r="4" fill="#22d3ee" filter="url(#softglow)"/><text x="82" y="160" class="mono" font-size="13.5" fill="#e6f1ff">Redis</text><rect class="tile" style="animation-delay:2.8s" x="236" y="134" width="172" height="42" rx="6" fill="#08101e" fill-opacity=".85" stroke="#a78bfa"/><circle class="led" style="animation-delay:1.4s" cx="254" cy="155" r="4" fill="#a78bfa" filter="url(#softglow)"/><text x="268" y="160" class="mono" font-size="13.5" fill="#e6f1ff">Docker</text><rect class="tile" style="animation-delay:3.2s" x="422" y="134" width="172" height="42" rx="6" fill="#08101e" fill-opacity=".85" stroke="#f472b6"/><circle class="led" style="animation-delay:1.6s" cx="440" cy="155" r="4" fill="#f472b6" filter="url(#softglow)"/><text x="454" y="160" class="mono" font-size="13.5" fill="#e6f1ff">OpenCore / ACPI</text><rect class="tile" style="animation-delay:3.6s" x="608" y="134" width="172" height="42" rx="6" fill="#08101e" fill-opacity=".85" stroke="#22d3ee"/><circle class="led" style="animation-delay:1.8s" cx="626" cy="155" r="4" fill="#22d3ee" filter="url(#softglow)"/><text x="640" y="160" class="mono" font-size="13.5" fill="#e6f1ff">macOS kexts</text><rect class="tile" style="animation-delay:4.0s" x="794" y="134" width="172" height="42" rx="6" fill="#08101e" fill-opacity=".85" stroke="#a78bfa"/><circle class="led" style="animation-delay:2.0s" cx="812" cy="155" r="4" fill="#a78bfa" filter="url(#softglow)"/><text x="826" y="160" class="mono" font-size="13.5" fill="#e6f1ff">LLM agents + RAG</text><rect class="tile" style="animation-delay:4.4s" x="980" y="134" width="172" height="42" rx="6" fill="#08101e" fill-opacity=".85" stroke="#f4