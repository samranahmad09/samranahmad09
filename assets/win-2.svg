<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 236" width="400" height="236" role="img" aria-label="NaSCon &#x27;26 APP DEV: TIED 1ST OF 12 TEAMS, nascon26-appdev">
<style>
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, SFMono-Regular, Consolas, monospace; }
  .sans { font-family: 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; }
  .drift { animation: drift 6s linear infinite; }
  .scan { animation: scan 7s linear infinite; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes drift { to { transform: translate(-32px, -32px); } }
  @keyframes scan { from { transform: translateY(-120px); } to { transform: translateY(276px); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  
  .shimmer { animation: shimmer 5s ease-in-out infinite 0.9s; }
  @keyframes shimmer { 0% { transform: translateX(-260px) skewX(-20deg); } 45%, 100% { transform: translateX(520px) skewX(-20deg); } }
  .twinkle { animation: twinkle 2.8s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
  .twinkle { transform-box: fill-box; transform-origin: center; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
